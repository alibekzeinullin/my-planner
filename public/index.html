<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfaf7">
<title>Мой планер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf7;--card:#fff;--ink:#17201f;--mut:#5e6967;--line:#ebe7df;--soft:#f1eee8;--teal:#0f766e;--teal-d:#0b5a54;--teal-s:#eaf4f2;--red:#e4572e;--red-d:#b33a17;--ROW:52px}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Onest,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:28px max(3vw,16px) 60px}
header{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.mon{font-size:13px;font-weight:600;color:var(--mut)}
h1{margin:2px 0 0;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.week{display:flex;gap:6px;align-items:center}
.wd{width:54px;height:64px;border-radius:14px;border:0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:inset 0 0 0 1px var(--line)}
.wd span{font-size:11px;font-weight:600;color:var(--mut)}.wd b{font-size:20px;font-weight:800}
.wd i{width:5px;height:5px;border-radius:50%;background:transparent}.wd i.on{background:var(--teal)}.wd i.ov{background:var(--red)}
.wd.sel{background:var(--ink);box-shadow:none}.wd.sel span,.wd.sel b{color:#fff}
.wd.today:not(.sel) b{color:var(--teal)}
.arr{width:36px;height:44px;border:0;background:none;font-size:20px;color:var(--mut);border-radius:10px}
.arr:hover{background:var(--soft)}
form.quick{margin-left:auto;display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:14px;padding:0 6px 0 16px;width:min(420px,100%);background:var(--card)}
form.quick input{flex:1;border:0;outline:none;background:transparent;font-size:15px;height:48px}
.btn{height:40px;padding:0 16px;border:0;border-radius:10px;background:var(--teal);color:#fff;font-weight:700;font-size:14px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--teal-d);box-shadow:inset 0 0 0 1.5px var(--teal)}
.btn.w{background:#fff;color:var(--red-d)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.6;cursor:wait}
.hint{font-size:13px;color:var(--mut);min-height:18px;margin:8px 0 0;text-align:right}
nav{display:flex;gap:4px;margin:14px 0 18px;flex-wrap:wrap;align-items:center}
.tab{border:0;background:none;padding:9px 14px;border-radius:10px;font-weight:600;color:var(--mut);min-height:40px}
.tab.on{background:var(--ink);color:#fff}
.tab small{font-weight:700;margin-left:4px;opacity:.7}
nav .set{margin-left:auto}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:24px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 20px}
.ch{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:8px}
.ch .hi{color:var(--red)}
.tl{position:relative;margin-top:4px}
.hr{height:var(--ROW);border-top:1px solid var(--soft);display:flex}
.hr span{width:48px;font-size:12px;color:var(--mut);padding-top:3px;font-variant-numeric:tabular-nums}
.blk{position:absolute;border-radius:12px;padding:6px 10px 6px 8px;display:flex;gap:8px;align-items:flex-start;cursor:pointer;overflow:hidden;border:0;text-align:left}
.blk .t{font-size:14px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk>div{min-width:0}
.blk .m{font-size:12px;opacity:.75;margin-top:1px}
.blk.done{opacity:.45}.blk.done .t{text-decoration:line-through}
.blk.p1 .t::after{content:" · срочно";color:var(--red);font-weight:700;font-size:12px}
.rtn{position:absolute;left:52px;right:0;border-radius:12px;background:repeating-linear-gradient(135deg,#f3f1ec 0 8px,#ebe8e1 8px 16px);pointer-events:none}
.rtn span{position:absolute;right:10px;top:6px;font-size:12px;font-weight:700;color:var(--mut);background:#f3f1ecd9;padding:1px 6px;border-radius:6px}
.blk{z-index:1}.now{z-index:2}
.rl{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--soft);font-size:14px}.rl span{flex:1}
.dchk{display:flex;gap:4px;flex-wrap:wrap}.dchk label{display:flex;align-items:center;gap:3px;font-size:13px;color:var(--ink)}
.chk{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid #a9b2b0;background:#fff;display:grid;place-items:center;padding:0;font-size:12px;line-height:1}
.chk.on{background:var(--ink);border-color:var(--ink);color:#fff}
.now{position:absolute;left:40px;right:0;height:2px;background:var(--red);pointer-events:none}
.now::before{content:"";position:absolute;left:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--red)}
.side{display:flex;flex-direction:column;gap:16px}
.over{background:var(--red);color:#fff;border-radius:20px;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.over .k{font-size:12px;font-weight:700;opacity:.85}
.orow{display:flex;gap:10px;align-items:center}
.orow .tt{flex:1;font-weight:700;cursor:pointer}
.orow .chk{border-color:#fff;background:transparent}
.ai{background:var(--teal-s);border-radius:20px;padding:16px 20px}
.ai .k{font-size:13px;font-weight:700;color:var(--teal-d);display:flex;justify-content:space-between;align-items:center;gap:10px}
.ai p{margin:8px 0 12px;font-size:14px;line-height:1.55;white-space:pre-line}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--soft)}
.li:first-of-type{border-top:0}
.li .tt{flex:1;font-weight:600;cursor:pointer}
.li .mm{font-size:12px;color:var(--mut);white-space:nowrap}
.li.done .tt{text-decoration:line-through;color:var(--mut)}
.mini{height:32px;padding:0 10px;border:0;border-radius:8px;background:var(--soft);font-size:12px;font-weight:700;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.empty{color:var(--mut);font-size:14px;padding:8px 0}
.goal{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--soft);cursor:pointer}
.goal:first-of-type{border-top:0}
.goal .k{font-size:12px;color:var(--mut)}.goal .t{font-size:17px;font-weight:700}
.bar{height:8px;background:var(--soft);border-radius:99px}.bar>div{height:100%;border-radius:99px;background:var(--teal)}
.pct{font-size:12px;text-align:right;color:var(--mut);margin-top:4px}
.lifeg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;align-items:start}
.wheel{width:100%;max-width:440px;aspect-ratio:1;display:block;margin:0 auto}
.wheel text{font:600 12px Onest,system-ui,sans-serif;fill:var(--ink)}
.leg{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ac{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card)}
.ac .n{font-weight:700;display:flex;align-items:center;gap:6px}
.ac .r{margin-left:auto;font-size:13px;color:var(--mut);font-weight:700}
.ac .s{font-size:13px;color:var(--mut);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px}
.ac .s b{color:var(--ink)}
.ac.warn{border-color:#f3c4b5;background:#fff8f5}
.up{color:var(--teal)}.down{color:var(--red)}
.cks{display:grid;grid-template-columns:70px repeat(21,minmax(0,1fr));gap:3px;align-items:end;font-size:11px;color:var(--mut)}
.ckb{border-radius:3px;min-height:3px}
.ckq{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:13px;color:var(--mut)}
.ckq button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700}
.ckq button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mem{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--soft);font-size:14px}
.mem:first-of-type{border-top:0}.mem span{flex:1}
.x{width:32px;height:32px;border:0;border-radius:8px;background:var(--soft);font-size:16px;line-height:1}
@media(max-width:900px){.lifeg{grid-template-columns:minmax(0,1fr)}.cks{grid-template-columns:56px repeat(21,minmax(0,1fr))}}
.bfil{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.addc{width:36px;justify-content:center;padding:0;font-size:20px;font-weight:500;border-style:dashed}
.aform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:14px}
.aform .f{height:42px;flex:1 1 180px}.aform .f.em{flex:0 0 64px;text-align:center}
.aform input[type=color]{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--card)}
.aform .btn{height:42px}
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
.col{background:var(--soft);border-radius:18px;padding:12px;display:flex;flex-direction:column;min-height:420px;scroll-snap-align:start}
.col h3{margin:2px 4px 10px;font-size:14px;display:flex;justify-content:space-between;align-items:baseline}
.col h3 small{color:var(--mut);font-weight:600}
.col.doing{background:#eaf4f2}.col.today{background:#fdf1ec}
.drop{flex:1;display:flex;flex-direction:column;gap:8px;min-height:80px}
.kc{background:var(--card);border-radius:14px;padding:10px 12px;border:1px solid var(--line);cursor:grab;touch-action:manipulation;user-select:none}
.kc:active{cursor:grabbing}
.kc .t{font-weight:600;font-size:14px;line-height:1.3}
.kc .m{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--mut);margin-top:6px;align-items:center}
.kc.done .t{text-decoration:line-through;color:var(--mut)}
.kc .p1{color:var(--red);font-weight:700}
.kc .ov{color:var(--red);font-weight:700}
.kghost{opacity:.35}.chosen{box-shadow:0 10px 30px rgb(0 0 0/.18);transform:rotate(1deg)}
.kadd{margin-top:8px;display:flex;gap:6px}
.kadd input{flex:1;height:38px;border:1px dashed #cfcac0;border-radius:10px;background:transparent;padding:0 10px;font-size:14px}
.kadd input:focus{background:var(--card);border-style:solid}
@media(max-width:900px){.board{grid-template-columns:repeat(5,minmax(78vw,1fr))}}
.allp .srch{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:14px;margin:2px 0 8px}
.allp .grp{font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 2px}
.allp .li{cursor:grab}
.allp .li[draggable=true]:active{cursor:grabbing}
.allp .scroll{max-height:440px;overflow-y:auto;margin-right:-8px;padding-right:8px}
.tl.over{outline:2px dashed var(--teal);outline-offset:4px;border-radius:8px}
.tl{cursor:cell;user-select:none;-webkit-user-select:none}
.tsel{position:absolute;left:52px;right:0;border-radius:12px;background:color-mix(in srgb,var(--teal) 22%,#fff);border:2px solid var(--teal);pointer-events:none;z-index:3;padding:4px 10px;font-size:13px;font-weight:700;color:var(--teal-d)}
.blk .rs{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.blk .rs::after{content:"";position:absolute;left:50%;bottom:2px;width:24px;height:3px;margin-left:-12px;border-radius:3px;background:currentColor;opacity:0;transition:opacity .15s}
.blk:hover .rs::after{opacity:.35}
.evrep{display:flex;gap:6px;flex-wrap:wrap}.evrep label{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:500;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer}
.evrep input{margin:0}.evrep label:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
.dropmark{position:absolute;left:52px;right:0;height:2px;background:var(--teal);pointer-events:none;z-index:3}
.dropmark span{position:absolute;left:0;top:-11px;background:var(--teal);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px}
dialog{max-height:90vh;overflow:auto;border:0;border-radius:20px;padding:0;max-width:520px;width:calc(100% - 24px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgb(0 0 0/.25)}
dialog::backdrop{background:rgb(23 32 31/.45)}
.dlg{padding:22px;display:grid;gap:12px}
.dlg h3{margin:0;font-size:22px}
label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.f{height:44px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;border-radius:10px}
textarea.f{height:80px;padding:10px 12px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.login{max-width:420px;margin:14vh auto;padding:0 16px;display:grid;gap:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.sr{position:absolute;left:-9999px}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.side{order:-1}form.quick{margin-left:0;width:100%}.week{overflow-x:auto;width:100%}}
@media(max-width:520px){h1{font-size:28px}.wd{width:44px;height:58px}.two:not(.keep){grid-template-columns:1fr}.goal{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"><form class="dlg" id="dlgForm" method="dialog"></form></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
{
const API = 'https://boqdferziwrkbntjmnsn.supabase.co/functions/v1/planner?action=api';
const START = 7, END = 23; // часы на шкале
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const WDF = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONN = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const PRI = {1:'Срочно',2:'Важно',3:'Обычно',4:'Когда-нибудь'};
const REC = {'':'Не повторять',daily:'Каждый день',weekdays:'По будням',weekly:'Каждую неделю',biweekly:'Раз в 2 недели',monthly:'Каждый месяц'};

let SORT = null, fArea = 0, aEdit = null;
let KEY = null, D = null, tab = 'day', day = null, weekOff = 0, planBusy = false, L = null, revBusy = false;
try { KEY = localStorage.getItem('planner_key'); } catch (e) {}
const hk = location.hash.match(/key=([a-f0-9]+)/);
if (hk) { KEY = hk[1]; try { localStorage.setItem('planner_key', KEY); } catch (e) {} history.replaceState(null, '', location.pathname); }

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }
async function call(op, body = {}) {
  const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': KEY }, body: JSON.stringify({ op, ...body }) });
  if (r.status === 401) { logout(); throw new Error('Неверный ключ'); }
  const j = await r.json(); if (j.error) throw new Error(j.error); return j;
}
function logout() { KEY = null; try { localStorage.removeItem('planner_key'); } catch (e) {} renderLogin(); }

const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dow = s => new Date(s + 'T00:00:00Z').getUTCDay();
const toMin = t => { const [h, m] = t.split(':'); return +h * 60 + +m; };
const fmin = m => m >= 60 ? `${Math.floor(m / 60)}ч${m % 60 ? ' ' + m % 60 + 'м' : ''}` : `${m}м`;
const hhmm = m => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
function fdate(s) { if (!s) return ''; const t = D.today; if (s === t) return 'сегодня'; if (s === addDays(t, 1)) return 'завтра'; if (s === addDays(t, -1)) return 'вчера'; const [, m, d] = s.split('-'); return `${WD[dow(s)]}, ${+d} ${MON[+m - 1]}`; }
const area = id => D.areas.find(a => a.id === id);
const col = id => (area(id) || {}).color || '#5e6967';
const nowMin = () => { const d = new Date(Date.now() + D.tz_offset * 36e5); return d.getUTCHours() * 60 + d.getUTCMinutes(); };
const open = () => D.tasks.filter(x => x.status === 'todo' && !x.parent_id);
const localDone = x => x.done_at ? new Date(new Date(x.done_at).getTime() + D.tz_offset * 36e5).toISOString().slice(0, 10) : null;

function renderLogin(msg = '') {
  $('#app').innerHTML = `<div class="login"><h1>Мой планер</h1>
  <p>Введи ключ доступа — его пришлёт бот по команде /site.</p>
  <form id="lf" style="display:grid;gap:10px"><label class="sr" for="lk">Ключ</label><input class="f" id="lk" autocomplete="off" placeholder="Ключ"><button class="btn" style="height:48px">Войти</button></form>
  <p style="color:var(--red)">${esc(msg)}</p></div>`;
  $('#lf').onsubmit = e => { e.preventDefault(); KEY = $('#lk').value.trim(); try { localStorage.setItem('planner_key', KEY); } catch (er) {} load(); };
}

async function load() {
  if (!KEY) return renderLogin();
  try { D = await call('bootstrap'); if (!day) day = D.today; render(); } catch (e) { if (KEY) renderLogin(e.message); }
}

function weekDays() {
  const base = addDays(D.today, weekOff * 7);
  const mon = addDays(base, -((dow(base) + 6) % 7));
  return [0, 1, 2, 3, 4, 5, 6].map(i => addDays(mon, i));
}

function render() {
  const all = open(), t = D.today;
  const [y, m, d] = day.split('-');
  const inboxN = all.filter(x => !x.due_date).length;
  const tabs = [['day', 'День', ''], ['board', 'Доска', ''], ['life', 'Баланс', ''], ['inbox', 'Без даты', inboxN || ''], ['goals', 'Цели и мечты', ''], ['done', 'Сделано', '']];
  $('#app').innerHTML = `<div class="wrap"><header>
    <div><div class="mon">${MONN[+m - 1]} ${y}</div><h1>${WDF[dow(day)]}, ${+d}</h1></div>
    <div class="week">
      <button class="arr" id="wPrev" aria-label="Прошлая неделя">‹</button>
      ${weekDays().map(s => {
        const has = all.some(x => x.due_date === s), ov = s === t && all.some(x => x.due_date && x.due_date < t);
        return `<button class="wd ${s === day ? 'sel' : ''} ${s === t ? 'today' : ''}" data-day="${s}" aria-label="${fdate(s)}"><span>${WD[dow(s)]}</span><b>${+s.slice(8)}</b><i class="${ov ? 'ov' : has ? 'on' : ''}"></i></button>`;
      }).join('')}
      <button class="arr" id="wNext" aria-label="Следующая неделя">›</button>
    </div>
    <form class="quick" id="qf"><label class="sr" for="qi">Новая задача</label><input id="qi" placeholder="Напиши как боту: «завтра в 11 созвон»" autocomplete="off"><button class="btn">Добавить</button></form>
  </header>
  <p class="hint" id="qh"></p>

      <button class="chk ${x.status === 'done' ? 'on' : ''}" data-done="${x.id}" aria-label="${x.status === 'done' ? 'Вернуть' : 'Готово'}">${x.status === 'done' ? '✓' : ''}</button>
      <div style="color:var(--ink)"><div class="t">${esc(x.title)}</div>${h >= 44 ? `<div class="m">${hhmm(s)}–${hhmm(e)}${a ? ' · ' + esc(a.name) : ''}</div>` : ''}</div>${x.status === 'todo' ? `<div class="rs" data-rs="${x.id}" data-s="${s}" title="Потяни, чтобы изменить длительность"></div>` : ''}</div>`;
  }).join('');
  const rts = (D.routines || []).filter(r => (r.days || []).includes(dow(day) || 7));
  const rtHtml = rts.map(r => { const s = Math.max(toMin(r.start), START * 60), e = Math.min(toMin(r.end), END * 60); if (e <= s) return '';
    return `<div class="rtn" style="top:${(s - START * 60) / 60 * ROW + 1}px;height:${(e - s) / 60 * ROW - 2}px"><span>${esc(r.title)} · ${r.start}–${r.end}</span></div>`; }).join('');

    </section>

        <button class="chk" data-done="${x.id}" aria-label="Готово"></button>

function wheelSvg(areas) {
  const n = areas.length || 1, C = 220, R = 150;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [C + Math.cos(a) * R * v, C + Math.sin(a) * R * v]; };
  const maxDone = Math.max(1, ...areas.map(a => a.done7));
  const poly = f => areas.map((a, i) => pt(i, f(a)).map(x => x.toFixed(1)).join(',')).join(' ');
  const rings = [0.2, 0.4, 0.6, 0.8, 1].map(r => `<polygon points="${areas.map((a, i) => pt(i, r).join(',')).join(' ')}" fill="none" stroke="#ebe7df"/>`).join('');
  const spokes = areas.map((a, i) => { const [x, y] = pt(i, 1); return `<line x1="${C}" y1="${C}" x2="${x}" y2="${y}" stroke="#ebe7df"/>`; }).join('');
  const hasRating = areas.some(a => a.rating);
  const labels = areas.map((a, i) => { const [x, y] = pt(i, 1.18); const anc = Math.abs(x - C) < 10 ? 'middle' : x > C ? 'start' : 'end';
    return `<text x="${x}" y="${y + 4}" text-anchor="${anc}">${esc(a.name.length > 16 ? a.name.slice(0, 15) + '…' : a.name)}</text>`; }).join('');
  return `<svg class="wheel" viewBox="-60 0 560 440" role="img" aria-label="Колесо баланса по сферам">${rings}${spokes}
    <polygon points="${poly(a => Math.max(a.done7 / maxDone, 0.04))}" fill="rgb(228 87 46 / .14)" stroke="#e4572e" stroke-width="2" stroke-dasharray="5 4"/>
    ${hasRating ? `<polygon points="${poly(a => (a.rating || 0) / 5)}" fill="rgb(15 118 110 / .22)" stroke="#0f766e" stroke-width="2.5"/>` : ''}
    ${labels}</svg>
    <div class="leg">${hasRating ? '<span><i style="background:#0f766e"></i>Твоя оценка недели</span>' : ''}<span><i style="background:#e4572e"></i>Сделано за 7 дней</span></div>`;
}

function colPatch(col, x) {

function bindAllPanel() {

  const tl = document.querySelector('.tl'); if (!tl) return;
  const ROWH = 52, at = e => { const y = e.clientY - tl.getBoundingClientRect().top; return Math.max(START * 60, Math.min((END - 1) * 60 + 45, START * 60 + Math.round(y / ROWH * 4) * 15)); };
  let mark = null;
  tl.ondragover = e => { e.preventDefault(); tl.classList.add('over'); const m = at(e);
    if (!mark) { mark = document.createElement('div'); mark.className = 'dropmark'; tl.appendChild(mark); }
    mark.style.top = ((m - START * 60) / 60 * ROWH) + 'px'; mark.innerHTML = `<span>${hhmm(m)}</span>`; };
  tl.ondragleave = e => { if (!tl.contains(e.relatedTarget)) { tl.classList.remove('over'); mark?.remove(); mark = null; } };
  tl.ondrop = async e => { e.preventDefault(); tl.classList.remove('over'); mark?.remove(); mark = null;
    const id = +e.dataTransfer.getData('text/plain'); if (!id) return; const m = at(e);
    try { await call('task_update', { id, patch: { due_date: day, due_time: hhmm(m), in_progress: false } }); toast(`Поставил на ${hhmm(m)}`); load(); } catch (er) { toast(er.message); } };
  // блоки на шкале тоже можно двигать по времени
  let resizing = false;
  document.querySelectorAll('.blk').forEach(b => { b.draggable = true; b.ondragstart = e => { if (resizing) { e.preventDefault(); return; } e.dataTransfer.setData('text/plain', b.dataset.edit); }; });
  bindTimeline(tl, at, () => resizing, v => { resizing = v; });
}
// ---- события как в календаре: клик/выделение по шкале, растягивание блока ----
function bindTimeline(tl, at, isResizing, setResizing) {
  const ROWH = 52, y = m => (m - START * 60) / 60 * ROWH;
  const empty = el => el === tl || el.classList.contains('hr') || el.parentElement?.classList.contains('hr');
  let sel = null, a0 = 0, moved = false;
  tl.onpointerdown = e => {
    if (e.button !== 0 || !empty(e.target)) return;
    a0 = Math.floor(at(e) / 15) * 15; moved = false;
    if (e.pointerType !== 'mouse') return; // на телефоне — просто тап (click ниже), чтобы не мешать прокрутке
    sel = document.createElement('div'); sel.className = 'tsel'; tl.appendChild(sel);
    const draw = (b) => { const s = Math.min(a0, b), en = Math.max(a0 + 15, b + 15);
      sel.style.top = y(s) + 'px'; sel.style.height = Math.max(y(en) - y(s), 18) + 'px'; sel.textContent = `${hhmm(s)}–${hhmm(en)}`; return [s, en]; };
    let rng = draw(a0);
    tl.setPointerCapture(e.pointerId);
    tl.onpointermove = ev => { const b = Math.floor(at(ev) / 15) * 15; if (b !== a0) moved = true; rng = draw(b); };
    tl.onpointerup = () => { tl.onpointermove = tl.onpointerup = null; sel?.remove(); sel = null;
      const [s, en] = moved ? rng : [Math.floor(a0 / 30) * 30, Math.floor(a0 / 30) * 30 + 60];
      newEvent(day, s, en); };
  };
  tl.onclick = e => { if (sel || !empty(e.target)) return;
    if (e.pointerType === 'mouse' || (e.detail && matchMedia('(pointer:fine)').matches)) return; // мышью обрабатываем в pointerup
    const s = Math.floor(at(e) / 30) * 30; newEvent(day, s, s + 60); };
  const nb = $('#newEv'); if (nb) nb.onclick = () => { const n = Math.ceil(Math.max(nowMin(), START * 60) / 30) * 30; newEvent(day, day === D.today ? n : 10 * 60, (day === D.today ? n : 10 * 60) + 60); };
  // растягивание нижнего края блока
  document.querySelectorAll('[data-rs]').forEach(h => h.onpointerdown = e => {
    e.stopPropagation(); e.preventDefault(); setResizing(true);
    const b = h.closest('.blk'), s = +h.dataset.s, id = +h.dataset.rs; let en = s;
    h.setPointerCapture(e.pointerId);
    h.onpointermove = ev => { en = Math.max(s + 15, Math.round(at(ev) / 15) * 15); b.style.height = Math.max(y(en) - y(s) - 4, 20) + 'px';
      const m = b.querySelector('.m'); if (m) m.textContent = `${hhmm(s)}–${hhmm(en)}`; };
    h.onpointerup = async () => { h.onpointermove = h.onpointerup = null; setTimeout(() => setResizing(false), 50);
      if (en > s) { try { await call('task_update', { id, patch: { estimate_min: en - s } }); toast(`${hhmm(s)}–${hhmm(en)}`); } catch (er) { toast(er.message); } load(); } };
    h.onclick = ev => ev.stopPropagation();
  });
}

  $('#dlgForm').onsubmit = async e => {

      <input class="f" id="rtT" placeholder="Например: Работа, Спортзал, Группы">
      <div class="dchk">${DN.map((n, i) => `<label><input type="checkbox" value="${i + 1}" ${i < 5 ? 'checked' : ''}>${n}</label>`).join('')}</div>
      <div class="two"><label>С<input class="f" type="time" id="rtS" value="09:00"></label><label>До<input class="f" type="time" id="rtE" value="18:00"></label></div>
      <button type="button" class="btn ghost" id="rtAdd" style="height:44px">+ Добавить блок</button></div></div>`;
}
function bindRoutines() {
  document.querySelectorAll('[data-rdel]').forEach(b => b.onclick = async () => { const r = await call('routine_delete', { id: +b.dataset.rdel }); D.routines = r.routines; openSettings(true); });
  const ad = $('#rtAdd'); if (ad) ad.onclick = async () => {
    const title = $('#rtT').value.trim(); if (!title) { $('#rtT').focus(); return; }
    const days = [...document.querySelectorAll('.dchk input:checked')].map(i => +i.value);
    const r = await call('routine_save', { routine: { title, days, start_time: $('#rtS').value, end_time: $('#rtE').value } });
    D.routines = r.routines; openSettings(true); toast('Добавил в распорядок');
  };
}
function openSettings(keep) {
  $('#dlgForm').innerHTML = `<h3>Настройки</h3>
    ${routineHtml()}
    <div class="two"><label>Утренний план, час<input class="f" type="number" min="4" max="12" name="morning_hour" value="${esc(D.morning_hour)}"></label>
    <label>Вечерний итог, час<input class="f" type="number" min="17" max="23" name="evening_hour" value="${esc(D.evening_hour)}"></label></div>
    <div class="acts"><button type="button" class="btn ghost" id="out" style="height:44px">Выйти</button><span style="display:flex;gap:8px"><button type="button" class="btn ghost" id="cancel" style="height:44px">Отмена</button><button class="btn" style="height:44px">Сохранить</button></span></div>`;
  const dlg = $('#dlg'); if (!dlg.open) dlg.showModal();
  bindRoutines();
  $('#cancel').onclick = () => { dlg.close(); render(); };
  $('#out').onclick = () => { dlg.close(); logout(); };
  $('#dlgForm').onsubmit = async e => { e.preventDefault(); await call('settings_save', Object.fromEntries(new FormData($('#dlgForm')).entries())); dlg.close(); toast('Сохранено'); load(); };
}

load();
setInterval(() => { if (KEY && D && !$('#dlg').open && document.visibilityState === 'visible' && !planBusy && !revBusy && tab !== 'life' && !aEdit && !document.querySelector('.chosen') && !(document.activeElement?.id || '').startsWith('ka-') && document.activeElement?.id !== 'srch' && document.activeElement?.id !== 'qi') load(); }, 60000);
}
</script>
</body>
</html>
